<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORS Test - ORFEAS Backend</title>
    <link rel="stylesheet" href="cors-test-styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>🔧 ORFEAS Backend CORS Test Suite</h1>

      <div class="test-section">
        <div class="test-title">📍 Endpoint Configuration</div>
        <label>Backend URL:</label>
        <input
          type="text"
          id="backendUrl"
          class="endpoint-input"
          value="http://127.0.0.1:5000"
          placeholder="http://127.0.0.1:5000 or https://your-ngrok-url"
        />
        <small
          >Change this to test against different backends (local or
          ngrok)</small
        >
      </div>

      <div class="test-section">
        <div class="test-title">🧪 Test 1: Health Check (GET)</div>
        <button onclick="testHealth()">Test GET /api/health</button>
        <div id="healthResponse" class="response hidden"></div>
      </div>

      <div class="test-section">
        <div class="test-title">🧪 Test 2: Preflight Request (OPTIONS)</div>
        <button onclick="testPreflight()">Test OPTIONS /api/models-info</button>
        <div id="preflightResponse" class="response hidden"></div>
      </div>

      <div class="test-section">
        <div class="test-title">🧪 Test 3: Models Info (GET)</div>
        <button onclick="testModels()">Test GET /api/models-info</button>
        <div id="modelsResponse" class="response hidden"></div>
      </div>

      <div class="test-section">
        <div class="test-title">🧪 Test 4: Run All Tests (Sequential)</div>
        <button onclick="runAllTests()">Run All Tests</button>
        <div id="allTestsResponse" class="response hidden"></div>
      </div>

      <div class="test-section">
        <div class="test-title">📊 Browser Info</div>
        <div id="browserInfo"></div>
      </div>

      <div class="test-section">
        <div class="test-title">📝 Request Log</div>
        <button onclick="clearLog()">Clear Log</button>
        <button onclick="downloadLog()">Download Log</button>
        <div id="log" class="response log-view"></div>
      </div>
    </div>

    <script>
      const logElement = document.getElementById("log");

      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const color =
          {
            info: "#17a2b8",
            success: "#28a745",
            error: "#dc3545",
            warning: "#ffc107",
          }[type] || "#333";

        const entry = document.createElement("div");
        entry.style.color = color;
        entry.style.marginBottom = "5px";
        entry.textContent = `[${timestamp}] ${message}`;
        logElement.appendChild(entry);
        logElement.scrollTop = logElement.scrollHeight;
      }

      function clearLog() {
        logElement.innerHTML = "";
        log("Log cleared", "info");
      }

      function downloadLog() {
        const text = Array.from(logElement.children)
          .map((el) => el.textContent)
          .join("\n");
        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `cors-test-log-${new Date().toISOString()}.txt`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function showBrowserInfo() {
        const info = `
                User Agent: ${navigator.userAgent}
                Platform: ${navigator.platform}
                Language: ${navigator.language}
                Online: ${navigator.onLine}
                Cookies Enabled: ${navigator.cookieEnabled}
            `;
        document.getElementById("browserInfo").innerHTML = `<pre>${info}</pre>`;
      }

      async function testHealth() {
        const responseDiv = document.getElementById("healthResponse");
        responseDiv.classList.remove("hidden");
        responseDiv.innerHTML = '<span class="loading">🔄 Testing...</span>';

        const url = document.getElementById("backendUrl").value + "/api/health";
        log(`GET ${url}`, "info");

        try {
          const response = await fetch(url, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
            },
          });

          log(`Status: ${response.status}`, "success");

          const headers = {};
          response.headers.forEach((value, key) => {
            headers[key] = value;
          });
          log(`Headers: ${JSON.stringify(headers, null, 2)}`, "info");

          const data = await response.json();

          responseDiv.innerHTML = `
                    <span class="success">✅ Success!</span><br><br>
                    <strong>Status:</strong> ${response.status}<br>
                    <strong>Headers:</strong><br><pre>${JSON.stringify(
                      headers,
                      null,
                      2
                    )}</pre>
                    <strong>Response:</strong><br><pre>${JSON.stringify(
                      data,
                      null,
                      2
                    )}</pre>
                `;

          log("GET /api/health completed successfully", "success");
        } catch (error) {
          log(`Error: ${error.message}`, "error");
          responseDiv.innerHTML = `
                    <span class="error">❌ Error!</span><br><br>
                    <strong>Error:</strong> ${error.message}<br>
                    <strong>Note:</strong> Check browser console (F12) for CORS errors
                `;
        }
      }

      async function testPreflight() {
        const responseDiv = document.getElementById("preflightResponse");
        responseDiv.classList.remove("hidden");
        responseDiv.innerHTML = '<span class="loading">🔄 Testing...</span>';

        const url =
          document.getElementById("backendUrl").value + "/api/models-info";
        log(`OPTIONS ${url}`, "info");

        try {
          const response = await fetch(url, {
            method: "OPTIONS",
            headers: {
              "Content-Type": "application/json",
            },
          });

          log(`Status: ${response.status}`, "success");

          const headers = {};
          response.headers.forEach((value, key) => {
            headers[key] = value;
          });

          const corsHeaders = {
            "Access-Control-Allow-Origin":
              headers["access-control-allow-origin"],
            "Access-Control-Allow-Methods":
              headers["access-control-allow-methods"],
            "Access-Control-Allow-Headers":
              headers["access-control-allow-headers"],
            "Access-Control-Max-Age": headers["access-control-max-age"],
          };

          log(
            `CORS Headers: ${JSON.stringify(corsHeaders, null, 2)}`,
            "success"
          );

          responseDiv.innerHTML = `
                    <span class="success">✅ Preflight OK!</span><br><br>
                    <strong>Status:</strong> ${
                      response.status
                    } (should be 204)<br>
                    <strong>CORS Headers:</strong><br><pre>${JSON.stringify(
                      corsHeaders,
                      null,
                      2
                    )}</pre>
                    <strong>All Headers:</strong><br><pre>${JSON.stringify(
                      headers,
                      null,
                      2
                    )}</pre>
                `;

          log("OPTIONS preflight completed successfully", "success");
        } catch (error) {
          log(`Preflight Error: ${error.message}`, "error");
          responseDiv.innerHTML = `
                    <span class="error">❌ Preflight Error!</span><br><br>
                    <strong>Error:</strong> ${error.message}<br>
                    <strong>Check:</strong> Browser console (F12) for CORS preflight errors
                `;
        }
      }

      async function testModels() {
        const responseDiv = document.getElementById("modelsResponse");
        responseDiv.classList.remove("hidden");
        responseDiv.innerHTML = '<span class="loading">🔄 Testing...</span>';

        const url =
          document.getElementById("backendUrl").value + "/api/models-info";
        log(`GET ${url}`, "info");

        try {
          const response = await fetch(url, {
            method: "GET",
            headers: {
              "Content-Type": "application/json",
            },
          });

          log(`Status: ${response.status}`, "success");

          const data = await response.json();

          responseDiv.innerHTML = `
                    <span class="success">✅ Success!</span><br><br>
                    <strong>Status:</strong> ${response.status}<br>
                    <strong>Response:</strong><br><pre>${JSON.stringify(
                      data,
                      null,
                      2
                    )}</pre>
                `;

          log("GET /api/models-info completed successfully", "success");
        } catch (error) {
          log(`Error: ${error.message}`, "error");
          responseDiv.innerHTML = `
                    <span class="error">❌ Error!</span><br><br>
                    <strong>Error:</strong> ${error.message}
                `;
        }
      }

      async function runAllTests() {
        const responseDiv = document.getElementById("allTestsResponse");
        responseDiv.classList.remove("hidden");
        responseDiv.innerHTML =
          '<span class="loading">🔄 Running all tests...</span>';

        log("Starting full test suite", "info");

        let results = "";

        // Test 1: Health
        results += "<h3>Test 1: Health Check</h3>";
        try {
          const response = await fetch(
            document.getElementById("backendUrl").value + "/api/health"
          );
          results += `<span class="success">✅ Status ${response.status}</span><br>`;
          log("Test 1 PASSED: Health check", "success");
        } catch (error) {
          results += `<span class="error">❌ ${error.message}</span><br>`;
          log("Test 1 FAILED: " + error.message, "error");
        }

        // Test 2: Preflight
        results += "<h3>Test 2: Preflight OPTIONS</h3>";
        try {
          const response = await fetch(
            document.getElementById("backendUrl").value + "/api/models-info",
            {
              method: "OPTIONS",
            }
          );
          results += `<span class="success">✅ Status ${response.status}</span><br>`;
          const corsOrigin = response.headers.get(
            "access-control-allow-origin"
          );
          if (corsOrigin) {
            results += `<span class="success">✅ CORS Origin: ${corsOrigin}</span><br>`;
            log("Test 2 PASSED: Preflight OPTIONS", "success");
          } else {
            results += `<span class="warning">⚠️  No CORS header</span><br>`;
          }
        } catch (error) {
          results += `<span class="error">❌ ${error.message}</span><br>`;
          log("Test 2 FAILED: " + error.message, "error");
        }

        // Test 3: Models
        results += "<h3>Test 3: Models Info</h3>";
        try {
          const response = await fetch(
            document.getElementById("backendUrl").value + "/api/models-info"
          );
          results += `<span class="success">✅ Status ${response.status}</span><br>`;
          const data = await response.json();
          results += `<span class="success">✅ Models returned</span><br>`;
          log("Test 3 PASSED: Models info", "success");
        } catch (error) {
          results += `<span class="error">❌ ${error.message}</span><br>`;
          log("Test 3 FAILED: " + error.message, "error");
        }

        responseDiv.innerHTML = results;
        log("Test suite completed", "info");
      }

      // Initialize
      window.addEventListener("load", () => {
        showBrowserInfo();
        log("CORS Test Suite Loaded", "success");
        log("Endpoint: " + document.getElementById("backendUrl").value, "info");
      });
    </script>
  </body>
</html>
