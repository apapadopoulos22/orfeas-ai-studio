---
apiVersion: v1
kind: Service
metadata:
  name: orfeas-backend
  namespace: orfeas-ai
  labels:
    app: orfeas-backend
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: http
      protocol: TCP
  selector:
    app: orfeas-backend

---
apiVersion: v1
kind: Service
metadata:
  name: orfeas-backend-internal
  namespace: orfeas-ai
  labels:
    app: orfeas-backend
    component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: orfeas-backend

---
apiVersion: v1
kind: Service
metadata:
  name: orfeas-redis
  namespace: orfeas-ai
  labels:
    app: orfeas-redis
    component: cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: orfeas-redis
