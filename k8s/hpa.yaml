---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orfeas-backend-hpa
  namespace: orfeas-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orfeas-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric: Queue depth
    - type: Pods
      pods:
        metric:
          name: orfeas_queue_depth
        target:
          type: AverageValue
          averageValue: "5"
    # Custom metric: GPU utilization
    - type: Pods
      pods:
        metric:
          name: orfeas_gpu_utilization_percent
        target:
          type: AverageValue
          averageValue: "75"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
