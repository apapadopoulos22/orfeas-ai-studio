---
apiVersion: v1
kind: Namespace
metadata:
  name: orfeas-ai
  labels:
    name: orfeas-ai
    environment: production

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: orfeas-quota
  namespace: orfeas-ai
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 160Gi
    requests.nvidia.com/gpu: "10"
    limits.cpu: "80"
    limits.memory: 320Gi
    limits.nvidia.com/gpu: "10"
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: orfeas-limits
  namespace: orfeas-ai
spec:
  limits:
    - max:
        cpu: "8"
        memory: 32Gi
      min:
        cpu: "2"
        memory: 8Gi
      default:
        cpu: "4"
        memory: 16Gi
      defaultRequest:
        cpu: "4"
        memory: 16Gi
      type: Container

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orfeas-backend-network-policy
  namespace: orfeas-ai
spec:
  podSelector:
    matchLabels:
      app: orfeas-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: orfeas-ai
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: orfeas-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
