---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orfeas-backend
  namespace: orfeas-ai
  labels:
    app: orfeas-backend
    component: api
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: orfeas-backend
  template:
    metadata:
      labels:
        app: orfeas-backend
        component: api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      # GPU node selector
      nodeSelector:
        nvidia.com/gpu: "true"

      # Tolerations for GPU nodes
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: backend
          image: orfeas/backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: metrics
              containerPort: 5000
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: orfeas-config

          # Environment variables from Secret
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orfeas-secrets
                  key: redis-password
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orfeas-secrets
                  key: database-password

          # Resource requests and limits
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: 1
            limits:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/gpu: 1

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe for slow-starting container
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # Volume mounts
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
            - name: output-storage
              mountPath: /app/backend/outputs
            - name: logs
              mountPath: /app/backend/logs

      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: orfeas-model-cache
        - name: output-storage
          persistentVolumeClaim:
            claimName: orfeas-outputs
        - name: logs
          emptyDir: {}

      # Init container to download models
      initContainers:
        - name: download-models
          image: orfeas/backend:latest
          command: ["python", "download_models.py"]
          volumeMounts:
            - name: model-cache
              mountPath: /app/models

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orfeas-model-cache
  namespace: orfeas-ai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orfeas-outputs
  namespace: orfeas-ai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: standard
