global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s # Evaluate rules every 15s
  external_labels:
    monitor: "orfeas-monitor"
    environment: "production"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093 # Alertmanager address

# Load rules once and periodically evaluate them
rule_files:
  - "prometheus_alerting_rules.yml"

scrape_configs:
  # ========== MAIN BACKEND APPLICATION ==========
  - job_name: "orfeas_backend"
    static_configs:
      - targets: ["localhost:5000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s

  # ========== DATABASE METRICS ==========
  - job_name: "postgresql"
    static_configs:
      - targets: ["localhost:9187"] # postgres_exporter
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========== REDIS CACHE ==========
  - job_name: "redis"
    static_configs:
      - targets: ["localhost:9121"] # redis_exporter
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========== SYSTEM METRICS ==========
  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========== GPU METRICS ==========
  - job_name: "gpu_metrics"
    static_configs:
      - targets: ["localhost:5000"]
    metrics_path: "/gpu_metrics"
    scrape_interval: 10s # More frequent GPU monitoring
    scrape_timeout: 10s

  # ========== NGINX/REVERSE PROXY ==========
  - job_name: "nginx"
    static_configs:
      - targets: ["localhost:9113"] # nginx_exporter
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========== DOCKER CONTAINER METRICS ==========
  - job_name: "cadvisor"
    static_configs:
      - targets: ["localhost:8080"] # cAdvisor
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========== KUBERNETES METRICS (if deployed on K8s) ==========
  - job_name: "kubernetes-apiservers"
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels:
          [
            __meta_kubernetes_namespace,
            __meta_kubernetes_service_name,
            __meta_kubernetes_endpoint_port_name,
          ]
        action: keep
        regex: default;kubernetes;https
# Remote storage configuration (optional)
# Uncomment to enable remote storage like Prometheus Long-Term Storage
# remote_write:
#   - url: "http://localhost:9009/api/v1/push"
#     write_relabel_configs:
#       - source_labels: [__name__]
#         regex: 'go_.*|process_.*'
#         action: drop
